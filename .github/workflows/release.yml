name: GitHub Release CI

on:
  push:
    tags: [ '*' ]

env:
  SIGNING_KEYSTORE_GITHUB: ${{ secrets.SIGNING_KEYSTORE_GITHUB }}
  SIGNING_PROPERTIES_GITHUB: ${{ secrets.SIGNING_PROPERTIES_GITHUB }}

# Creating the GitHub release needs write access; the repo's default token is read-only.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Without the signing secrets the APK is signed with the debug key (see app/build.gradle.kts).
      - name: Setup Signing
        run: ./ci_signing_setup.sh
      - name: Build
        run: ./gradlew app:assembleRelease
      - name: Github Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
